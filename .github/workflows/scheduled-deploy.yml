name: Scheduled blog publish

# Triggers a fresh Render deploy so newly-dated posts (11:30 and 18:00
# America/New_York) re-render and become visible. GitHub cron is fixed UTC, so we
# fire at both DST offsets for each slot; the date gate (lib/blog-schedule.ts) is
# DST-correct, so the redundant build is harmless — each post goes live at the
# exact ET instant on the nearest run.
#
# RENDER_DEPLOY_HOOK is the service's Deploy Hook URL
# (Render dashboard → service → Settings → Deploy Hook), stored as a GitHub
# Actions repo secret. Render deploys whatever branch the service tracks (main).
on:
  schedule:
    - cron: "30 15 * * *" # 11:30 EDT (summer)
    - cron: "30 16 * * *" # 11:30 EST (winter)
    - cron: "0 22 * * *" # 18:00 EDT (summer)
    - cron: "0 23 * * *" # 18:00 EST (winter)
  workflow_dispatch: {} # allow manual "publish now" runs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set" >&2
            exit 1
          fi
          # Render deploy hooks accept a GET request and return JSON with the deploy id.
          curl -fsS "$RENDER_DEPLOY_HOOK"
